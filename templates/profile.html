{% extends "base.html" %}
{% block content %}

<h2>Profile Settings</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Username</label>
    <input class="form-control" name="username" value="{{ user[0] }}">

    <label class="mt-3">Email</label>
    <input class="form-control" name="email" value="{{ user[1] }}">

    <label class="mt-3">Profile Photo</label>
    <input type="file" class="form-control" name="profile_photo">

    <img src="{{ url_for('static', filename=profile_photo) }}"
         class="rounded mt-3" style="height:120px;width:120px;object-fit:cover;">

    <button class="btn btn-primary mt-4">Save Changes</button>
</form>

{% endblock %}
